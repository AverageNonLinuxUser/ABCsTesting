<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Budget</title>
<meta name="description" content="Simple daily budget calculator with monthly cycle and offline support.">
<meta name="theme-color" content="#24273A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Budget">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#24273A; --surface:#363A4F; --line:#494D64; --text:#CAD3F5;
    --muted:#A5ADCB; --gold:#C6A0F6; --accent-ink:#181926; --pos:#A6DA95; --neg:#ED8796;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *{box-sizing:inherit;}
  body{
    margin:0; min-height:100%; background:var(--bg); color:var(--text);
    font-family:'Inter',ui-sans-serif,system-ui,sans-serif;
    display:flex; justify-content:center;
  }
  #app{width:100%; max-width:480px; padding:28px 20px 60px; text-align:center;}
  .display{font-family:'Fraunces',Georgia,serif;}
  h1.brand{font-size:15px; letter-spacing:.02em; color:var(--muted); margin:0 0 22px; font-weight:500;}
  .hero{border-bottom:1px solid var(--line); padding-bottom:22px; margin-bottom:22px;}
  .hero .num{font-size:56px; line-height:1.05; font-weight:600;}
  .hero .num small{font-size:22px; color:var(--muted); font-weight:400;}
  .hero .sub{color:var(--muted); font-size:14px; margin-top:8px;}
  .neg-flag{color:var(--neg);}
  .row{display:flex; justify-content:space-between; align-items:center;}
  .stat-line{display:flex; justify-content:space-between; font-size:14px; padding:9px 0; border-bottom:1px solid var(--line);}
  .stat-line span:first-child{color:var(--muted);}
  .section-title{font-size:13px; color:var(--muted); margin:26px 0 10px; display:flex; justify-content:space-between; align-items:center;}
  form.add{display:flex; gap:8px; margin-bottom:14px; justify-content:center;}
  .stat-line, ul.expenses li, .section-title, .panel label, .hint{text-align:left;}
  input, button{font-family:inherit; font-size:15px;}
  input[type=number], input[type=text]{
    background:var(--surface); border:1px solid var(--line); color:var(--text);
    border-radius:8px; padding:10px 12px; width:100%;
  }
  input:focus{outline:2px solid var(--gold); outline-offset:1px;}
  .amt-input{max-width:110px; flex:none;}
  button{
    cursor:pointer; border:none; border-radius:8px; padding:10px 16px;
    background:var(--gold); color:var(--accent-ink); font-weight:600;
  }
  button.ghost{background:transparent; color:var(--muted); border:1px solid var(--line); font-weight:500;}
  button.icon{background:transparent; border:none; color:var(--muted); font-size:18px; padding:2px 8px;}
  ul.expenses{list-style:none; margin:0; padding:0;}
  ul.expenses li{
    display:flex; justify-content:space-between; align-items:center;
    padding:11px 0; border-bottom:1px solid var(--line); font-size:14px;
  }
  ul.expenses li .note{color:var(--muted); font-size:12.5px; margin-top:2px;}
  .empty{color:var(--muted); font-size:14px; padding:16px 0;}
  .gear{background:none; border:none; color:var(--muted); font-size:18px; cursor:pointer; padding:4px;}
  .panel{
    position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex;
    align-items:flex-end; justify-content:center; z-index:10;
  }
  .panel .card{
    background:var(--surface); width:100%; max-width:480px; border-radius:16px 16px 0 0;
    padding:24px 20px calc(28px + env(safe-area-inset-bottom,0px));
  }
  .panel label{display:block; font-size:13px; color:var(--muted); margin:14px 0 6px;}
  .panel .actions{display:flex; gap:10px; margin-top:20px;}
  .panel h2{margin:0; font-size:18px; font-family:'Fraunces',serif; font-weight:600;}
  .hint{font-size:12.5px; color:var(--muted); margin-top:6px;}
  .topbar{display:flex; justify-content:space-between; align-items:center;}
  .install-btn{display:none; font-size:13px; padding:7px 12px;}
  .install-btn.show{display:inline-block;}
  .install-help{font-size:12.5px; color:var(--muted); margin-top:10px; display:none;}
  .install-help.show{display:block;}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  var KEY = 'baht-budget-v1';
  var THB0 = new Intl.NumberFormat('th-TH',{style:'currency',currency:'THB',maximumFractionDigits:0});
  var THB2 = new Intl.NumberFormat('th-TH',{style:'currency',currency:'THB',maximumFractionDigits:2});

  function load(){ try{ var r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; }catch(e){ return null; } }
  function save(s){ try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(e){} }

  function clampDay(y,m,day){ // m is 0-indexed, may over/underflow on purpose
    var last = new Date(y, m+1, 0).getDate();
    return new Date(y, m, Math.min(day, last));
  }
  function cycleFor(refreshDay, today){
    var y = today.getFullYear(), m = today.getMonth();
    var thisRefresh = clampDay(y,m,refreshDay); thisRefresh.setHours(0,0,0,0);
    var start, end;
    if (today >= thisRefresh){
      start = thisRefresh;
      end = clampDay(y, m+1, refreshDay); end.setHours(0,0,0,0);
    } else {
      start = clampDay(y, m-1, refreshDay); start.setHours(0,0,0,0);
      end = thisRefresh;
    }
    return {start:start, end:end};
  }

  var state = load();
  var panelOpen = null; // 'setup' | 'settings' | null
  if (!state) panelOpen = 'setup';

  var app = document.getElementById('app');

  function render(){
    var today = new Date(); today.setHours(0,0,0,0);
    var html = '<h1 class="brand">DAILY BUDGET</h1>';

    if (state){
      var cyc = cycleFor(state.refreshDay, today);
      var spent = state.expenses
        .filter(function(e){ return e.ts >= cyc.start.getTime() && e.ts < cyc.end.getTime(); })
        .reduce(function(a,e){ return a + e.amount; }, 0);
      var remaining = state.monthlyBudget - spent;
      var daysLeft = Math.max(1, Math.round((cyc.end - today) / 86400000));
      var daily = remaining / daysLeft;
      var over = daily < 0;

      html += '<div class="hero">'
        + '<div class="row topbar"><button class="ghost install-btn" id="installBtn" type="button">Download app</button><span></span><button class="gear" data-act="settings">⚙</button></div>'
        + '<div class="install-help" id="installHelp"></div>'
        + '<div class="num display' + (over?' neg-flag':'') + '">' + THB0.format(daily) + ' <small>/ day</small></div>'
        + '<div class="sub">' + daysLeft + ' day' + (daysLeft===1?'':'s') + ' until refresh &middot; ' + THB2.format(remaining) + ' left of ' + THB2.format(state.monthlyBudget) + '</div>'
        + '</div>';

      html += '<div class="section-title">Add expense</div>'
        + '<form class="add" id="addForm">'
        + '<input class="amt-input" type="number" step="0.01" min="0.01" placeholder="0.00" id="amtInput" required>'
        + '<input type="text" placeholder="What for? (optional)" id="noteInput">'
        + '<button type="submit">Add</button>'
        + '</form>';

      var inCycle = state.expenses
        .filter(function(e){ return e.ts >= cyc.start.getTime() && e.ts < cyc.end.getTime(); })
        .sort(function(a,b){ return b.ts - a.ts; });

      html += '<div class="section-title">This cycle</div>';
      if (inCycle.length === 0){
        html += '<div class="empty">No expenses logged yet this cycle.</div>';
      } else {
        html += '<ul class="expenses">' + inCycle.map(function(e){
          var d = new Date(e.ts);
          return '<li><div><div>' + (e.note || 'Expense') + '</div>'
            + '<div class="note">' + d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}) + '</div></div>'
            + '<div class="row" style="gap:10px;"><span>' + THB2.format(e.amount) + '</span>'
            + '<button class="icon" data-act="del" data-id="' + e.id + '">&times;</button></div></li>';
        }).join('') + '</ul>';
      }
    }

    if (panelOpen === 'setup' || panelOpen === 'settings'){
      var mb = state ? state.monthlyBudget : '';
      var rd = state ? state.refreshDay : '';
      html += '<div class="panel"><div class="card">'
        + '<h2>' + (panelOpen==='setup' ? 'Set up your budget' : 'Edit budget') + '</h2>'
        + '<label for="mbInput">Monthly budget (THB)</label>'
        + '<input type="number" min="1" step="1" id="mbInput" value="' + mb + '" placeholder="15000">'
        + '<label for="rdInput">Resets on day of month</label>'
        + '<input type="number" min="1" max="31" id="rdInput" value="' + rd + '" placeholder="1">'
        + '<div class="hint">E.g. if you get paid on the 25th, set this to 25.</div>'
        + '<div class="actions">'
        + (panelOpen==='settings' ? '<button class="ghost" data-act="cancelPanel">Cancel</button>' : '')
        + '<button data-act="savePanel">Save</button>'
        + '</div></div></div>';
    }

    app.innerHTML = html;
    wire();
  }

  function wire(){
    var addForm = document.getElementById('addForm');
    if (addForm){
      addForm.addEventListener('submit', function(ev){
        ev.preventDefault();
        var amt = parseFloat(document.getElementById('amtInput').value);
        if (!amt || amt <= 0) return;
        var note = document.getElementById('noteInput').value.trim();
        state.expenses.push({ id: Date.now()+'-'+Math.random(), amount: amt, note: note, ts: Date.now() });
        save(state);
        render();
      });
    }
    app.querySelectorAll('[data-act="del"]').forEach(function(btn){
      btn.addEventListener('click', function(){
        state.expenses = state.expenses.filter(function(e){ return e.id !== btn.dataset.id; });
        save(state);
        render();
      });
    });
    var gear = app.querySelector('[data-act="settings"]');
    if (gear) gear.addEventListener('click', function(){ panelOpen = 'settings'; render(); });
    var cancel = app.querySelector('[data-act="cancelPanel"]');
    if (cancel) cancel.addEventListener('click', function(){ panelOpen = null; render(); });
    var saveBtn = app.querySelector('[data-act="savePanel"]');
    if (saveBtn) saveBtn.addEventListener('click', function(){
      var mb = parseFloat(document.getElementById('mbInput').value);
      var rd = parseInt(document.getElementById('rdInput').value, 10);
      if (!mb || mb <= 0 || !rd || rd < 1 || rd > 31) return;
      if (!state) state = { expenses: [] };
      state.monthlyBudget = mb;
      state.refreshDay = rd;
      save(state);
      panelOpen = null;
      render();
    });
    wireInstallButton();
  }

  // ---- Install / download (PWA) ----
  var deferredPrompt = null;
  function isIosSafari(){
    var ua = window.navigator.userAgent || '';
    var iOS = /iphone|ipad|ipod/i.test(ua);
    var isSafari = /^((?!chrome|crios|fxios|edgios).)*safari/i.test(ua);
    return iOS && isSafari;
  }
  function isStandalone(){
    return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || window.navigator.standalone === true;
  }
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferredPrompt = e;
    var btn = document.getElementById('installBtn');
    if (btn) btn.classList.add('show');
  });
  window.addEventListener('appinstalled', function(){
    deferredPrompt = null;
    var btn = document.getElementById('installBtn');
    if (btn) btn.classList.remove('show');
    var help = document.getElementById('installHelp');
    if (help) help.classList.remove('show');
  });
  function wireInstallButton(){
    var btn = document.getElementById('installBtn');
    var help = document.getElementById('installHelp');
    if (!btn) return;
    // Already installed: hide everything.
    if (isStandalone()) return;
    // Chrome/Edge/Android: show once beforeinstallprompt has fired.
    if (deferredPrompt) btn.classList.add('show');
    // iOS Safari has no prompt: show manual instructions.
    if (isIosSafari() && help){
      btn.classList.add('show');
      btn.textContent = 'Download app';
      help.textContent = 'Tap Share, then “Add to Home Screen” to install.';
      help.classList.add('show');
    }
    btn.addEventListener('click', function(){
      if (deferredPrompt){
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function(){ deferredPrompt = null; });
      } else if (help){
        var isiOS = /iphone|ipad|ipod/i.test(window.navigator.userAgent || '');
        help.textContent = isiOS
          ? 'Tap Share, then “Add to Home Screen” to install.'
          : 'In your browser menu choose “Install app” or “Add to Home screen”. Serving over http(s) is required for the automatic prompt.';
        help.classList.add('show');
      }
    });
  }

  // Offline support: no-op on file://, works when served over http(s).
  if ('serviceWorker' in navigator && /^https?:$/.test(window.location.protocol)){
    window.addEventListener('load', function(){
      try { navigator.serviceWorker.register('./sw.js'); } catch (e) {}
    });
  }

  render();
})();
</script>
</body>
</html>
